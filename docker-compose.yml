# Local hospital server. Run: cp .env.example .env && docker compose up -d --build
x-app: &app
  build: .
  env_file: .env
  depends_on:
    db: {condition: service_healthy}
    redis: {condition: service_started}
  restart: unless-stopped

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    restart: unless-stopped
  web:
    <<: *app
    command: sh -c "python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health/')"]
      interval: 30s
      retries: 3
  worker:
    <<: *app
    command: celery -A config worker -l info
  beat:
    <<: *app
    command: celery -A config beat -l info

volumes:
  pgdata:
