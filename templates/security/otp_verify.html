{% extends "base.html" %}
{% block title %}Second step{% endblock %}
{% block content %}
<div class="login card"><h1>Second step</h1><p class="sub">Type the 6-digit code from your authenticator app.</p>
<form method="post" class="stack">{% csrf_token %}{% include "_field.html" with field=form.code %}<button class="btn primary" type="submit">Continue</button></form>
<form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="btn" type="submit">Sign out</button></form></div>
{% endblock %}
