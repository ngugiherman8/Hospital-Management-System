{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="head"><div><div class="crumb">Account</div><h1>Change your password</h1>{% if forced %}<p class="sub">Your account was set up with a temporary password. Choose your own before you continue.</p>{% endif %}</div></div>
<section class="card"><form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn primary" type="submit">Change password</button></form></section>
{% endblock %}
