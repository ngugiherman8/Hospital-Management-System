{% extends "base.html" %}

{% block content %}
<div class="head"><div><div class="crumb"><a href="{% url 'issue_list' %}">Problems</a></div><h1>{{ title }}</h1><p class="sub">Do not type patient names. Use the paper number or hospital number instead.</p></div></div>

{% endblock %}
