{% extends "base.html" %}{% block title %}Sign in{% endblock %}
{% block content %}<div class="login card"><h1>Sign in</h1><p class="sub">{{ HOSPITAL_NAME }} management system</p>
<form method="post">{% csrf_token %}
{% for e in form.non_field_errors %}<p class="err" role="alert">{{ e }}</p>{% endfor %}
<div class="field"><label for="id_username">Username</label>{{ form.username }}</div>
<div class="field"><label for="id_password">Password</label>{{ form.password }}</div>
<button class="btn primary" type="submit">Sign in</button></form></div>{% endblock %}
