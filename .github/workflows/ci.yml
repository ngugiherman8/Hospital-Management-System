name: CI
on:
  push: {branches: [main]}
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: hms, POSTGRES_PASSWORD: hms, POSTGRES_DB: hms}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hms" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_HOST: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Formatting
        run: ruff format --check .
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run
        env: {DJANGO_SETTINGS_MODULE: config.settings.test}
      - name: Production settings check
        run: python manage.py check --deploy --fail-level WARNING
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          DJANGO_SECRET_KEY: ci-only-long-random-secret-key-0123456789-abcdefghijklmnopqrstuvwxyz
      - name: Tests
        run: pytest

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t hms:ci .
