name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hms
          POSTGRES_USER: hms
          POSTGRES_PASSWORD: hms
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_DEBUG: "true"
      POSTGRES_HOST: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run
      - name: Django system check (production settings)
        run: python manage.py check --deploy --fail-level ERROR
        env:
          DJANGO_DEBUG: "false"
          DJANGO_SECRET_KEY: ci-only-not-a-real-secret-key-0123456789-abcdefghijklmnopqrstuvwxyz
      - name: Known vulnerabilities in installed packages
        run: pip-audit --local --skip-editable
      - name: Tests
        run: pytest
      - name: Compose files are valid
        run: |
          cp .env.example .env
          docker compose -f docker-compose.prod.yml config -q
          docker compose -f docker-compose.prod.yml -f docker-compose.training.yml config -q
          cp .env.cloud.example .env.cloud
          docker compose -f docker-compose.cloud.yml --env-file .env.cloud config -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t hms:ci .
