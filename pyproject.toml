[project]
name = "hms"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.2,<5.3",
    "djangorestframework>=3.16",
    "django-htmx>=1.23",
    "psycopg[binary]>=3.2",
    "celery>=5.5",
    "redis>=5.2",
    "gunicorn>=23.0",
    "whitenoise>=6.9",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "DJ"]
ignore = ["DJ001", "DJ008", "DJ012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
